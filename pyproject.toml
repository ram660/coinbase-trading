[project]
name = "cbagent"
version = "0.1.0"
description = "Rule-based Coinbase trading agent with paper trading by default"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Only needed for live mode.
live = ["coinbase-advanced-py>=1.7"]

[project.scripts]
cbagent = "cbagent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
