# Runs the paper books every 15 minutes and the daily brief each morning, in GitHub's cloud.
# Simulated money only: no API keys or secrets are used. State is committed back to the repo's `paper-state` branch.
name: paper-trading

on:
  schedule:
    # GitHub skips and delays scheduled runs when it is busy, so the workflow fires every 5 minutes. The "Decide" step
    # runs the books only when they haven't run in the last 12 minutes, so they run about every 15 minutes. Each run
    # also rebalances every book (small adjustments are skipped to save fees). The brief runs on the first run from 15:00 UTC (7 am Vancouver).
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Run the books even if they ran less than 12 minutes ago"
        type: boolean
        default: false
      brief:
        description: "Also build the daily brief"
        type: boolean
        default: false

permissions:
  contents: write   # push state to the paper-state branch
  actions: read     # run history for the dashboard
  pages: write      # publish the dashboard
  id-token: write

concurrency:
  group: paper-trading
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    outputs:
      ran: ${{ steps.due.outputs.rotate == 'true' || steps.due.outputs.brief == 'true' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore state from the paper-state branch
        run: |
          git fetch origin paper-state || true
          if git rev-parse --verify origin/paper-state >/dev/null 2>&1; then
            git checkout origin/paper-state -- data/ || true
          fi

      - name: Decide what is due
        id: due
        run: |
          PYTHONPATH=src python -m cbagent due ${{ inputs.force && '--force' || '' }} ${{ inputs.brief && '--brief' || '' }} | tee -a "$GITHUB_OUTPUT"

      - name: Run paper books
        if: steps.due.outputs.rotate == 'true'
        run: PYTHONPATH=src python -m cbagent rotate

      - name: Daily brief
        if: steps.due.outputs.brief == 'true'
        run: PYTHONPATH=src python -m cbagent brief

      - name: Fetch workflow run history
        if: ${{ !cancelled() && (steps.due.outputs.rotate == 'true' || steps.due.outputs.brief == 'true') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The cron fires every 5 minutes, so 48 hours is about 580 runs: fetch six pages of 100.
          for page in 1 2 3 4 5 6; do
            gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/paper-trading.yml/runs?per_page=100&page=$page" \
              > "$RUNNER_TEMP/runs_$page.json" || echo '{}' > "$RUNNER_TEMP/runs_$page.json"
          done
          python -c 'import json, sys; print(json.dumps({"workflow_runs": [r for f in sys.argv[1:] for r in json.load(open(f)).get("workflow_runs", [])]}))' \
            "$RUNNER_TEMP"/runs_*.json > "$RUNNER_TEMP/workflow_runs.json"

      - name: Build dashboard
        if: ${{ !cancelled() && (steps.due.outputs.rotate == 'true' || steps.due.outputs.brief == 'true') }}
        run: |
          PYTHONPATH=src python -m cbagent dashboard --out "$RUNNER_TEMP/site/index.html" \
            --runs "$RUNNER_TEMP/workflow_runs.json" --repo "$GITHUB_REPOSITORY"

      - name: Upload dashboard
        if: ${{ !cancelled() && (steps.due.outputs.rotate == 'true' || steps.due.outputs.brief == 'true') }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

      - name: Save state to the paper-state branch
        if: steps.due.outputs.rotate == 'true' || steps.due.outputs.brief == 'true'
        run: |
          git config user.name "paper-trading-bot"
          git config user.email "paper-trading-bot@users.noreply.github.com"
          mkdir -p /tmp/state && cp -r data /tmp/state/
          git fetch origin paper-state || true
          if git rev-parse --verify origin/paper-state >/dev/null 2>&1; then
            git checkout -B paper-state origin/paper-state
          else
            git checkout --orphan paper-state && git rm -rf --cached . >/dev/null && git clean -fdx -e /tmp
          fi
          rm -rf data && cp -r /tmp/state/data data
          git add -f data
          git commit -m "paper state $(date -u +%Y-%m-%dT%H:%MZ)" || echo "no changes"
          git push origin paper-state

  # Publishes the dashboard to GitHub Pages. Needs Settings > Pages > Source = "GitHub Actions" once; until then this
  # job fails on its own without failing the paper run.
  dashboard:
    needs: run
    if: ${{ !cancelled() && needs.run.outputs.ran == 'true' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
